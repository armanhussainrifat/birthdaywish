<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy 20th Birthday Eshu!</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg1:#2a0a3d;--bg2:#6b1d5c;--bg3:#e0507a;--ink:#fff7fb;--soft:#ffd6e7;--gold:#ffd36b;--card:rgba(255,255,255,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Poppins',system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));background-attachment:fixed;overflow-x:hidden;text-align:center}
.script{font-family:'Great Vibes',cursive,serif}
section{min-height:100vh;display:none;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px;position:relative;z-index:2}
section.on{display:flex;animation:fade .8s ease}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1{font-size:clamp(2.6rem,12vw,5rem);margin:.2em 0;color:var(--gold);text-shadow:0 0 24px rgba(255,211,107,.5);font-weight:400}
h2{font-weight:300;margin:.2em 0 1em;color:var(--soft)}
.card{background:var(--card);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:24px;max-width:440px;width:100%}
input,textarea{width:100%;margin:8px 0;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.25);color:var(--ink);font:inherit}
textarea{min-height:110px;resize:vertical}
button{cursor:pointer;border:0;border-radius:999px;padding:14px 30px;font:500 1rem 'Poppins',sans-serif;color:#4a0f3a;background:linear-gradient(135deg,#ffe29a,#ffb86b);box-shadow:0 8px 24px rgba(0,0,0,.3);margin-top:14px;transition:transform .15s}
button:active{transform:scale(.96)}
#gear{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;margin:0;padding:8px 10px;background:transparent;box-shadow:none;opacity:.12;font-size:1rem}
.gift{font-size:6rem;animation:bob 1.6s ease-in-out infinite;cursor:pointer;user-select:none}
@keyframes bob{50%{transform:translateY(-14px) rotate(4deg)}}
.cake{position:relative;width:240px;margin:30px auto 10px}
.candles{display:flex;justify-content:center;gap:26px;height:70px;align-items:flex-end}
.candle{width:12px;height:42px;background:repeating-linear-gradient(#fff 0 8px,#ff8fb3 8px 16px);border-radius:3px;position:relative;cursor:pointer}
.flame{position:absolute;left:50%;top:-20px;width:14px;height:22px;margin-left:-7px;background:radial-gradient(#fff6b0 20%,#ffb000 60%,transparent 72%);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;animation:fl .3s infinite alternate;filter:drop-shadow(0 0 8px #ffb000)}
.candle.off .flame{display:none}
@keyframes fl{to{transform:scale(1.15,.9) rotate(4deg)}}
.tier{height:48px;border-radius:12px;margin:0 auto}
.t1{width:150px;background:#ffb3cf}.t2{width:200px;background:#ff7fae;margin-top:-4px}.t3{width:240px;background:#d94e86;margin-top:-4px;height:56px}
.msg{font-size:1.15rem;line-height:1.8;min-height:8em;white-space:pre-wrap;text-align:left}
.hint{color:var(--soft);font-size:.9rem;opacity:.85}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.heart{position:fixed;bottom:-30px;z-index:1;pointer-events:none;animation:up linear forwards}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
.sig{margin-top:18px;font-size:2rem;color:var(--gold)}
.up{display:block;margin:10px 0;padding:12px;border:2px dashed rgba(255,255,255,.4);border-radius:12px;cursor:pointer;color:var(--soft);font-size:.95rem}
.up input{display:none}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:22px;max-width:760px;width:100%;margin:18px 0}
.frame{background:#fffaf0;padding:10px 10px 34px;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 0 4px var(--gold) inset;border:6px solid #c9983a;position:relative;animation:pop .7s both}
.frame:nth-child(odd){transform:rotate(-3deg)}.frame:nth-child(even){transform:rotate(3deg)}
.frame img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;border-radius:2px}
.frame:after{content:'❤️';position:absolute;bottom:6px;left:0;right:0;font-size:1.1rem}
@keyframes pop{from{opacity:0;scale:.6}to{opacity:1;scale:1}}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<section id="s0">
  <h2 class="script" style="font-size:2rem">Your secret setup 🤫</h2>
  <div class="card">
    <input id="her" placeholder="Her name" maxlength="40" value="Eshu">
    <input id="me" placeholder="Your name" maxlength="40" value="Ahsan">
    <textarea id="txt" placeholder="Write your wish from the heart… (leave empty for a ready-made one)"></textarea>
    <label class="up">📸 Add your photos together (up to 6)<input type="file" id="pics" accept="image/*" multiple></label>
    <div class="hint" id="picn"></div>
    <button id="go">Save &amp; hide this 🤫</button>
  </div>
</section>

<section id="s1" class="on">
  <button id="gear" title="setup" aria-label="setup">⚙️</button>
  <p class="hint">Something special is waiting for you…</p>
  <div class="gift" id="gift">🎁</div>
  <p class="hint">Tap the gift</p>
</section>

<section id="s2">
  <h1 class="script">Happy 20th Birthday</h1>
  <h1 class="script" id="n1" style="margin-top:-.1em"></h1>
  <div class="cake">
    <div class="candles" id="candles"></div>
    <div class="tier t1"></div><div class="tier t2"></div><div class="tier t3"></div>
  </div>
  <p class="hint" id="blowhint">Make a wish, then tap each candle to blow it out 🕯️</p>
  <button id="blow" style="display:none">Blow them all 🌬️</button>
</section>

<section id="s3">
  <h1 class="script" style="font-size:clamp(2.4rem,10vw,4rem)">My dearest <span id="n2"></span></h1>
  <div class="card"><div class="msg" id="msg"></div></div>
  <div class="sig script" id="sig"></div>
  <div class="row"><button id="mem">Our best moments 📸</button><button id="again">Celebrate again 🎉</button></div>
</section>

<section id="s4">
  <h1 class="script" style="font-size:clamp(2.2rem,9vw,3.8rem)">The Best Moments of Ours 💞</h1>
  <div class="gal" id="gal"></div>
  <p class="script" style="font-size:1.8rem;color:var(--gold);margin:0">…and many more to come, my love.</p>
  <div class="row"><button id="back">Back 💌</button></div>
</section>

<script>
const $=id=>document.getElementById(id);
let her="Eshu",me="Ahsan",custom="";
function show(i){document.querySelectorAll('section').forEach((s,k)=>s.classList.toggle('on',k===i));window.scrollTo(0,0)}
const cv=$('cv'),cx=cv.getContext('2d');let parts=[],run=false;
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener('resize',size);
function burst(x,y,n){const c=['#ffd36b','#ff7fae','#fff','#8be9ff','#c79bff'];for(let i=0;i<n;i++){const a=Math.random()*6.28,v=3+Math.random()*7;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,g:.15,r:3+Math.random()*4,c:c[i%5],l:90+Math.random()*60,rot:Math.random()*6})}if(!run){run=true;loop()}}
function loop(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.l>0);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.99;p.l--;p.rot+=.2;cx.globalAlpha=Math.min(1,p.l/40);cx.fillStyle=p.c;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore()});if(parts.length)requestAnimationFrame(loop);else{run=false;cx.clearRect(0,0,cv.width,cv.height)}}
function rain(){let k=0;const t=setInterval(()=>{burst(Math.random()*cv.width,Math.random()*cv.height*.5,60);if(++k>6)clearInterval(t)},350)}

$('mem').onclick=()=>{const g=$('gal');g.innerHTML='';if(!pics.length){g.innerHTML='<p class="hint">No photos added yet.</p>'}pics.forEach((s,i)=>{const d=document.createElement('div');d.className='frame';d.style.animationDelay=(i*.25)+'s';d.innerHTML='<img alt="Our moment">';d.firstChild.src=s;g.appendChild(d)});show(4);burst(innerWidth/2,innerHeight/3,100)};
$('back').onclick=()=>show(3);
$('gear').onclick=()=>show(0);
$('go').onclick=()=>{her=$('her').value.trim()||"Eshu";me=$('me').value.trim()||"Ahsan";custom=$('txt').value.trim();show(1)};
$('gift').onclick=()=>{burst(innerWidth/2,innerHeight/2,120);setTimeout(()=>{show(2);build();rain();if(!hs){hs=true;hearts()}},700)};
function build(){$('n1').textContent=her+" 🎂";const c=$('candles');c.innerHTML='';$('blow').style.display='none';
 for(let i=0;i<5;i++){const d=document.createElement('div');d.className='candle';d.innerHTML='<div class="flame"></div>';d.onclick=()=>{d.classList.add('off');check()};c.appendChild(d)}
 setTimeout(()=>$('blow').style.display='inline-block',1500)}
function check(){if(!document.querySelector('.candle:not(.off)'))finish()}
$('blow').onclick=()=>{document.querySelectorAll('.candle').forEach(d=>d.classList.add('off'));finish()};
let typing;
function finish(){$('blowhint').textContent="Your wish will come true ✨";burst(innerWidth/2,innerHeight/2,160);setTimeout(()=>{show(3);rain();write()},1400)}
function write(){
 $('n2').textContent=her;$('sig').textContent="Forever yours, "+me+" ❤️";
 const def=`Happy 20th Birthday, my love!\n\nTwenty beautiful years of you, and every one of them has made the world brighter. Thank you for your smile, your patience, and every little moment that makes my life better. With you, home is wherever you are.\n\nMay this new year bring you all the happiness, peace and success you deserve, and may I be right beside you for every beautiful moment.\n\nI love you more than words can say, Eshu.`;
 const t=custom||def,el=$('msg');el.textContent='';let i=0;clearInterval(typing);
 typing=setInterval(()=>{el.textContent+=t[i++]||'';if(i>=t.length)clearInterval(typing)},45)}
$('again').onclick=()=>{rain();clearInterval(typing);write()};
